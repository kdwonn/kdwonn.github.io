{%- comment -%}
  Interactive publication preview drawn by assets/js/acid-fig.js.
  Params: scene (bib field `preview_figure`), alt (accessible description).
{%- endcomment -%}
<div class="pub-figure">
  <canvas data-acid-scene="{{ include.scene }}" data-acid-style="drafting" data-acid-colorway="ultramarine" data-acid-boil="true" role="img" aria-label="{{ include.alt | strip_html | escape }}"></canvas>
</div>
<script defer src="{{ '/assets/js/acid-fig.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
